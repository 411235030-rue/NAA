include:
  # image 版本號 yaml記錄檔
  - image_version_tag.yaml
  - project: 'devopsteam/ci-templates'
    ref: main
    file: 'include.gitlab-ci.yml'
  
variables:
  SOURCE_PATH: "src/WEB_NAA"
  DOTNET_SDK_VERSION_TAG: "dotnet8"
  USE_TELERIK: "true" # 是否使用 TELERIK，控制啟用/提用金鑰授權流程，沒使用可刪除該行
  CI_PIPELINE_TYPE: "" # 固定為空
